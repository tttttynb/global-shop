server:
  port: 8080

spring:
  # 本地开发敏感配置放在 application-local.yml（已被 .gitignore 忽略，不要提交）
  profiles:
    active: local
  # 🆕 以图搜图（Phase 2 - F4）：放开上传限制，业务层再按 5MB 校验
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/global_shop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: ${ES_PASSWORD:}
  ai:
    openai:
      # 替换为你申请的 API Key（可以去阿里云百炼控制台免费开通通义千问）
      api-key: ${AI_API_KEY:}
      # 通义千问的 OpenAI 兼容模式网关地址（不含 /v1，Spring AI 会自动拼接）
      base-url: https://llm-csa7m4x0d9n2i92y.cn-beijing.maas.aliyuncs.com/compatible-mode
      embedding:
        # 🚨 Spring AI 默认拼接 /v1/embeddings，所以 base-url 不能带 /v1
        # 最终请求: .../compatible-mode/v1/embeddings
        api-key: ${AI_API_KEY:}
        base-url: https://llm-csa7m4x0d9n2i92y.cn-beijing.maas.aliyuncs.com/compatible-mode
        options:
          model: text-embedding-v4
  # 🚀 消息队列底层配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 开启发送确认机制，保证消息绝对不丢失
    publisher-confirm-type: correlated
    publisher-returns: true
# 🚀 Langchain4j 专属大模型配置
langchain4j:
  open-ai:
    chat-model:
      # 替换成你之前申请的阿里云 API Key
      api-key: ${AI_API_KEY:}
      # 阿里云的 OpenAI 兼容网关地址
      base-url: https://llm-csa7m4x0d9n2i92y.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      # 指定能聊天的强大模型（qwen-plus 对 Function Calling 的支持极好）
      model-name: qwen3.7-plus
      # 开启日志：让你能在 IDEA 控制台偷窥 AI 在底层是怎么思考和调用的！
      log-requests: true
      log-responses: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  # 🚀 个性化推荐总开关（Phase 4 A/B 测试）
  # true=个性化 Agent, false=通用 Agent（用于对比效果）
  personalization:
    enabled: true
  # 💱 多币种汇率（Phase 3 - F5）
  forex:
    enabled: true                 # 关闭后只用库内/兜底汇率，不外呼 API
    refresh-cron: "0 0 * * * ?"   # 每小时整点刷新
    cache-minutes: 60             # Redis 缓存 1 小时
    # 静态兜底汇率（1 外币 = X 人民币）：迁移脚本预置同款，API 全挂时保命
    fallback-rates: USD=7.10,EUR=7.80,GBP=9.05,JPY=0.048,KRW=0.0052,THB=0.21
  # 🌍 商品多语言（Phase 3 - F5）
  i18n:
    auto-translate: true          # 商品发布/编辑后异步 AI 翻译（控制 LLM 成本的降级开关）
    target-languages: en,ja,ko,th # 复用直播翻译已验证的语种链路
  # 🧾 跨境税费（Phase 3 - F6）
  tax:
    enabled: true                 # 关闭后运费/税费均为 0（等价旧行为）
    default-shipping-fee: 29.00   # 国际运费固定档（简化版，无重量维度）
    free-shipping-threshold: 199.00  # 满额包邮门槛
    default-rate: 0.0910          # tax_rule 表未初始化时的兜底综合税率
  # 👥 社交拼团（Phase 4 - F7）
  group-buy:
    daily-join-limit: 5           # 风控：每人每天最多开团/参团次数（Redis 计数）
    expire-scan-ms: 30000         # 过期团扫描间隔（毫秒），超时未成团自动退款
  # 🎁 会员积分（Phase 4 - F8）
  points:
    enabled: true                 # 积分体系总开关（关闭后不发放/不可抵扣）
    earn-per-yuan: 1              # 每消费 1 元返积分
    sign-in-points: 5             # 每日签到基础积分
    sign-in-streak-bonus: 5       # 连续签到每天额外加成（封顶值，连签 N 天加 min(N-1, cap)）
    review-points: 10             # 评价晒单积分
    review-daily-limit: 3         # 评价返积分每日上限（Redis 防刷）
    profile-bonus: 50             # 完善用户画像一次性奖励
    points-per-yuan: 100          # 抵扣比例：100 积分 = 1 元
    max-deduction-ratio: 0.5      # 单笔订单积分最多抵扣商品金额的 50%
    level-growth: 0,1000,5000,20000          # 各等级成长值门槛（青铜/白银/黄金/钻石）
    level-names: 青铜会员,白银会员,黄金会员,钻石会员
    level-discounts: 0,0.01,0.02,0.03        # 各等级下单折扣率（0.02 = 98折）
  # 🗣️ AI 口碑档案 2.0（Phase 4 - F9）
  reputation:
    enabled: true                 # 关闭后接口返回空档案，不做 LLM 生成
    min-reviews: 3                # 评价数达到该值才生成档案（防噪声）
    flush-interval-ms: 300000     # 防抖合并：新评价标记 pending，每 5 分钟批量重算
  # 💳 支付配置
  payment:
    channels: balance,alipay,stripe  # 启用的支付渠道
    alipay:
      enabled: false
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/callback/alipay}
      sandbox: true
    stripe:
      enabled: false
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    wechat:
      enabled: false
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      api-key: ${WECHAT_API_KEY:}
  live:
    aliyun:
      access-key-id: ${LIVE_ACCESS_KEY_ID:your-access-key-id}
      access-key-secret: ${LIVE_ACCESS_KEY_SECRET:your-access-key-secret}
      push-domain: ${LIVE_PUSH_DOMAIN:push.example.com}
      pull-domain: ${LIVE_PULL_DOMAIN:pull.example.com}
      app-name: ${LIVE_APP_NAME:globalshop}
      auth-key: ${LIVE_AUTH_KEY:your-auth-key}
    translation:
      nls-app-key: ${NLS_APP_KEY:your-nls-app-key}
      nls-access-key: ${NLS_ACCESS_KEY:your-nls-access-key}
      nls-access-secret: ${NLS_ACCESS_SECRET:your-nls-access-secret}
      supported-languages: en,ja,ko,th
      max-concurrent-sessions: 100
  # 🚚 物流配置
  shipment:
    # 自动确认收货：已签收N天后自动确认
    auto-confirm-days: 7
    # 物流查询API（占位，后续对接快递100/17TRACK）
    tracking-api:
      enabled: false
      provider: kuaidi100
      api-key: ${TRACKING_API_KEY:}
  # 📬 通知配置
  notification:
    email:
      enabled: false  # 设为 true 并填写下方 SMTP 信息以启用邮件通知
      host: smtp.example.com
      port: 587
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:noreply@globalshop.com}
    websocket:
      enabled: true   # WebSocket 实时推送开关